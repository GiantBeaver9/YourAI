services:
  scp:
    build: .
    ports:
      - "8000:8000"
    environment:
      # optional — set to route the LLM leg to a real Claude model; unset => deterministic mock
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # default CMD serves the API on :8000 (POST /process, /obfuscate; GET /health)
    # run the demo:   docker-compose run --rm scp python demo.py
    # run the tests:  docker-compose run --rm scp pytest -q
